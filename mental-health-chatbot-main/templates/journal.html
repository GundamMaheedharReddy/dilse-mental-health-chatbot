<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DilSe – Journal</title>
<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/616/616494.png">
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f8fafc;
        margin: 0;
        padding: 0;
    }

    .journal-container {
        max-width: 600px;
        margin: 40px auto;
        background: #f8fafc;
        border-radius: 18px;
        box-shadow: 0 4px 18px rgba(37,99,235,0.08);
        padding: 32px 28px;
    }

    .journal-title {
        font-size: 2rem;
        color: #2563eb;
        margin-bottom: 18px;
        text-align: center;
    }

    .journal-form textarea {
        width: 100%;
        min-height: 160px;
        font-size: 1.1rem;
        border-radius: 12px;
        border: 1px solid #bcd;
        padding: 16px;
        margin-bottom: 18px;
        resize: vertical;
    }

    .journal-form div.button-group {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
    }

    .journal-form button,
    .journal-form .download-btn {
        border: none;
        border-radius: 10px;
        padding: 12px 28px;
        font-size: 1.1rem;
        cursor: pointer;
        font-weight: 500;
        transition: background 0.2s;
    }

    .journal-form button {
        background: #2563eb;
        color: #fff;
    }

    .journal-form button:hover {
        background: #1e40af;
    }

    .journal-form .download-btn {
        background: linear-gradient(90deg,#2563eb 60%,#60a5fa 100%);
        color: #fff;
        text-decoration: none;
        box-shadow: 0 2px 8px rgba(37,99,235,0.10);
    }

    .journal-form .download-btn:hover {
        background: linear-gradient(90deg,#1e40af 60%,#3b82f6 100%);
    }

    .journal-entries {
        margin-top: 32px;
    }

    .entry {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 1px 6px rgba(37,99,235,0.07);
        padding: 18px;
        margin-bottom: 18px;
    }

    .entry-date {
        color: #888;
        font-size: 0.95rem;
        margin-bottom: 8px;
    }

    .back-btn {
        background:#e0e7ff;
        color:#2563eb;
        border:none;
        border-radius:8px;
        padding:8px 18px;
        text-decoration:none;
        font-size:1rem;
        font-weight:500;
        box-shadow:0 1px 4px rgba(37,99,235,0.08);
        transition:background 0.2s;
    }

    .back-btn:hover {
        background:#dbeafe;
    }

    .info-note {
        color:#444;
        background:#e0e7ff;
        border-radius:10px;
        padding:16px;
        margin-bottom:18px;
        font-size:1.08rem;
        text-align:center;
    }
</style>
</head>
<body>

<div class="journal-container">
    <div style="margin-bottom:18px;text-align:left;">
        <a href="/" class="back-btn">← Back</a>
    </div>

    <div class="journal-title">My Journal</div>

    <div class="info-note">
        💡 In short: The journal is a personal space for self-reflection, mood tracking, habit tracking, gratitude, and goal setting. Over time, it helps users understand themselves better, recognize patterns, and build mental resilience.
    </div>

    <form class="journal-form" id="journal-form">
        <textarea id="journal-text" placeholder="Write your thoughts, feelings, or experiences here..."></textarea>
        <div class="button-group">
            <button type="submit">Save Entry</button>
            <a href="/api/journal/download" download class="download-btn">📝 Download Journal</a>
        </div>
    </form>

    <div class="journal-entries" id="journal-entries"></div>
</div>

<script>
    // Helper to escape HTML
    function escapeHtml(s){
        if(!s) return "";
        return s.replace(/[&<>"]+/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]} );
    }

    // Fetch journal entries
    async function getEntries() {
        const res = await fetch('/api/journal');
        if (!res.ok) return [];
        const data = await res.json();
        return data.entries || [];
    }

    // Save new entry
    async function saveEntry(text) {
        const res = await fetch('/api/journal', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, date: new Date().toLocaleString() })
        });
        return res.ok;
    }

    // Delete entry
    async function deleteEntry(idx) {
        if(!confirm('Delete this entry?')) return;
        const res = await fetch('/api/journal/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ idx })
        });
        if(res.ok) renderEntries();
        else alert('Failed to delete entry.');
    }

    // Edit entry
    function editEntry(idx) {
        const textDiv = document.getElementById('entry-text-' + idx);
        const oldText = textDiv.textContent;
        textDiv.innerHTML = `<textarea style='width:100%;min-height:60px;'>${escapeHtml(oldText)}</textarea>
            <button style='margin-top:8px;background:#2563eb;color:#fff;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;' onclick='saveEdit(${idx})'>Save</button>
            <button style='margin-top:8px;margin-left:8px;background:#aaa;color:#fff;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;' onclick='cancelEdit(${idx}, "${escapeHtml(oldText)}")'>Cancel</button>`;
    }

    async function saveEdit(idx) {
        const textDiv = document.getElementById('entry-text-' + idx);
        const textarea = textDiv.querySelector('textarea');
        const newText = textarea.value.trim();
        if(!newText) return alert('Entry cannot be empty.');
        const res = await fetch('/api/journal/edit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ idx, text: newText })
        });
        if(res.ok) renderEntries();
        else alert('Failed to edit entry.');
    }

    function cancelEdit(idx, text) {
        const textDiv = document.getElementById('entry-text-' + idx);
        textDiv.innerHTML = escapeHtml(text);
    }

    // Render all entries
    async function renderEntries() {
        const entries = await getEntries();
        const entriesDiv = document.getElementById('journal-entries');
        entriesDiv.innerHTML = entries.length ? '' : '<p style="color:#888;text-align:center;">No entries yet. Start writing!</p>';
        entries.forEach((entry, idx) => {
            const div = document.createElement('div');
            div.className = 'entry';
            let dateStr = entry.date;
            if (dateStr) {
                const d = new Date(dateStr);
                if (!isNaN(d)) dateStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString();
            }
            div.innerHTML = `<div class="entry-date">${dateStr}</div>
                <div class="entry-text" id="entry-text-${idx}">${escapeHtml(entry.text)}</div>
                <div style="margin-top:10px;text-align:right;">
                    <button onclick="editEntry(${idx})" style="margin-right:8px;background:#fbbf24;color:#222;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;">Edit</button>
                    <button onclick="deleteEntry(${idx})" style="background:#ef4444;color:#fff;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;">Delete</button>
                </div>`;
            entriesDiv.appendChild(div);
        });
    }

    // Form submission
    document.getElementById('journal-form').addEventListener('submit', async function(e){
        e.preventDefault();
        const text = document.getElementById('journal-text').value.trim();
        if(text){
            const ok = await saveEntry(text);
            if(ok){
                document.getElementById('journal-text').value = '';
                renderEntries();
            } else {
                alert('Failed to save entry.');
            }
        }
    });

    // Initial render
    renderEntries();
</script>

</body>
</html>
