<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dilse – Mental Health Companion</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
/* Typing indicator (dot animation) */
.thinking-container { 
    display:flex; 
    align-items:center; 
    gap:10px;
    background: #d0e7ff;
    color:#333;
    padding:10px 14px;
    border-radius:18px;
    max-width:70%;
}
.thinking-inner { display:flex; align-items:center; gap:12px; }
.typing { display:flex; gap:5px; }
.dot { width:10px; height:10px; background:#2563eb; border-radius:50%; animation:bounce 1s infinite; }
.dot:nth-child(2){ animation-delay:0.2s; }
.dot:nth-child(3){ animation-delay:0.4s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
</style>
</head>
<body>

<!-- Landing Page -->
<div id="landing">
    <div class="landing-overlay">
        <div class="landing-content">
            <div class="avatar">🤖</div>
            <h1>Dilse</h1>
            <p>“A mirror for your mind — reflecting your thoughts, reframing your worries, and reminding you you’re never alone.”</p>
            <button class="start-btn" id="start-btn">Start Chatting Now</button>
        </div>
    </div>
</div>

<!-- Chat Interface -->
<div id="main-app" style="display:none;">
    <div class="chat-wrapper">
        <header>
            <div class="header-content">
                <h1>Dilse</h1>
                <p>Be kind to your mind</p>
                <button id="open-journal-btn" onclick="window.location.href='/journal'" title="Open Journal" style="margin-left:auto;padding:8px 12px;border-radius:8px;border:none;background:#2563eb;color:#fff;cursor:pointer;">
                    Journal
                </button>
            </div>
        </header>

        <div id="chat-box" class="chat-box"></div>

        <!-- Quick replies hidden until name is entered -->
        <div class="quick-replies" id="quick-replies" style="display:none;">
            <div class="quick-row">
                <button onclick="sendQuick('I feel stressed')">😢 Stressed</button>
                <button onclick="sendQuick('I am happy')">😊 Happy</button>
                <button onclick="sendQuick('I feel anxious')">😟 Anxious</button>
                <button onclick="sendQuick('I feel calm')">😌 Calm</button>
                <button onclick="sendQuick('I feel sad')">😔 Sad</button>
            </div>
            <div class="quick-row">
                <button onclick="sendQuick('I feel angry')">😡 Angry</button>
                <button onclick="sendQuick('I feel relaxed')">😴 Relaxed</button>
                <button onclick="sendQuick('I feel focused')">🧠 Focused</button>
                <button onclick="sendQuick('I feel lonely')">🤝 Lonely</button>
                <button onclick="sendQuick('I feel excited')">🤩 Excited</button>
            </div>
        </div>

        <form id="chat-form">
            <input type="text" id="user-input" placeholder="Please enter your name to start..." autocomplete="off" required>
            <button type="submit">Send</button>
        </form>

        <button id="download-btn">💾 Save Conversation</button>
    </div>
</div>

<script>
document.getElementById("start-btn").addEventListener("click", () => {
    document.getElementById("landing").style.display = "none";
    document.getElementById("main-app").style.display = "block";
    addMessage("dilse", "Hello! I’m Dilse, your mental health companion. May I know your name?");
});

let chatHistory = [];
let userName = null;

const chatBox = document.getElementById("chat-box");
const chatForm = document.getElementById("chat-form");
const userInput = document.getElementById("user-input");
const quickReplies = document.getElementById("quick-replies");
const downloadBtn = document.getElementById("download-btn");

let thinkingElem = null;

function addMessage(sender, message) {
    const msgDiv = document.createElement("div");
    msgDiv.classList.add("message", sender);
    if(sender === "user"){
        msgDiv.textContent = message;
    } else {
        msgDiv.innerHTML = `<span class="avatar">🤖</span> ${message}`;
    }
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
    chatHistory.push({sender, message});
}

function showThinking(text = "Dilse is thinking…") {
    if (thinkingElem) return;
    thinkingElem = document.createElement("div");
    thinkingElem.className = "message dilse thinking-container";
    thinkingElem.innerHTML = `
        <span class="avatar">🤖</span>
        <div class="typing">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    `;
    chatBox.appendChild(thinkingElem);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function hideThinking() {
    if (!thinkingElem) return;
    thinkingElem.remove();
    thinkingElem = null;
}

chatForm.addEventListener("submit", e => {
    e.preventDefault();
    let msg = userInput.value.trim();
    if(msg){
        sendMessage(msg);
        userInput.value = "";
    }
});

function sendQuick(msg){
    userInput.value = msg;
    sendMessage(msg);
}

async function sendMessage(msg){
    addMessage("user", msg);

    if(!userName){
        const EMOTIONS = ["happy","sad","angry","anxious","excited","stressed","calm","lonely","relaxed","tired","bored","scared","afraid","depressed","upset","ok","okay","yes","yeah","no","not"];
        const nameRegex = /\b(?:my name is|call me|i am|i'm|im)\s+([A-Za-z][A-Za-z'\-\s]*)/i;
        const match = msg.match(nameRegex);
        if(match){
            let nameCaptured = match[1].trim().split(/[,\.\!\?]/)[0].split(/\s+/)[0];
            if(nameCaptured.length >= 2 && !EMOTIONS.includes(nameCaptured.toLowerCase())){
                userName = nameCaptured.charAt(0).toUpperCase() + nameCaptured.slice(1).toLowerCase();
                addMessage("dilse", `Nice to meet you, ${userName}! How are you feeling today?`);
                userInput.placeholder = "How are you feeling today? 💛";
                quickReplies.style.display = "flex";
                return;
            }
        }

        if(msg.split(/\s+/).length === 1){
            const token = msg.replace(/[^A-Za-z'\-]/g, "");
            if(token.length >= 2 && !EMOTIONS.includes(token.toLowerCase())){
                userName = token.charAt(0).toUpperCase() + token.slice(1).toLowerCase();
                addMessage("dilse", `Nice to meet you, ${userName}! How are you feeling today?`);
                userInput.placeholder = "How are you feeling today? 💛";
                quickReplies.style.display = "flex";
                return;
            }
        }

        addMessage("dilse", "Hello! I’m Dilse, your mental health companion. May I know your name?");
        return;
    }

    try{
        showThinking();

        const res = await fetch("/chat", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({message: msg})
        });

        hideThinking();
        const data = await res.json();
        addMessage("dilse", data.reply);
    } catch(err){
        hideThinking();
        addMessage("dilse", "⚠️ Error: Cannot reach server.");
    }
}

downloadBtn.addEventListener("click", () => {
    let text = chatHistory.map(m => `${m.sender.toUpperCase()}: ${m.message}`).join("\n");
    const blob = new Blob([text], {type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "dilse_chat.txt";
    a.click();
    URL.revokeObjectURL(url);
});
</script>
</body>
</html>
